# vCentral behind nginx (native install). Installed to /etc/nginx/sites-available/vcentral.
# Written for the nginx in Ubuntu 22.04/24.04 (1.18/1.24).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/vcentral/certs/vcentral.crt;
    ssl_certificate_key /etc/vcentral/certs/vcentral.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:vcentral_ssl:10m;

    server_tokens off;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;   # login throttling and the audit log
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
        proxy_read_timeout 300s;   # agent installs through VMware Tools can take a while
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
